appId: com.huntara.app

productName: "HUNTARA"

npmRebuild: true

directories:
  output: dist
  buildResources: resources

files:
  - out/**
  - package.json
  - "!src"
  - "!electron.vite.config.*"
  - "!**/*.map"
  - "!**/.turbo"

asar: true

compression: maximum

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

extraMetadata:
  main: out/main/index.js

win:
  target:
    - nsis
  icon: resources/HUNTARA.ico
  forceCodeSigning: false
  sign: null

nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "HUNTARA"
  runAfterFinish: true

mac:
  target:
    - dmg
    - zip
  icon: resources/HUNTARA.icns

linux:
  target:
    - AppImage
  icon: resources/icons

publish:
  provider: github
  owner: kjxcodez
  repo: huntara